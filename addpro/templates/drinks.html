{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="text-center fw-bold mb-4">Drinks</h2>

    <div class="row">
        {% for product in products %}
        <div class="col-md-3 mb-4">
            <div class="card shadow-sm">
                <img src="{{ product.image.url }}" class="card-img-top" height="250">
                <div class="card-body text-center">
                    <h5 class="fw-bold">{{ product.name }}</h5>
                    <p class="text-dark">${{ product.price }}</p>
                    <a href="{% url 'product' product.id %}" class="btn btn-dark btn-sm">View Product</a>
                </div>
            </div>
        </div>
        {% empty %}
        <h4 class="text-center text-danger">No Jordan products available.</h4>
        {% endfor %}
    </div>
</div>
{% endblock %}
