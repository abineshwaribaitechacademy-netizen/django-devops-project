{% extends 'base.html' %}
{% block content %}

<div class="container mt-4">

    <div class="card mb-3 shadow">
        <div class="row g-0">

            <!-- Product Image -->
            <div class="col-md-4">
                <img src="{{ product.image.url }}" class="img-fluid rounded-start" alt="Product Image">
            </div>

            <!-- Product Information -->
            <div class="col-md-8">
                <div class="card-body text-center">

                    <h3 class="card-title fw-bold">{{ product.name }}</h3>
                    <p class="card-text mt-3">{{ product.description }}</p>

                    {% if product.is_sale %}
                        <!-- Sale Badge -->
                        <div class="d-flex justify-content-center small text-warning mb-2">
                            <div class="bi-star-fill"></div>
                            &nbsp;&nbsp;Sale!&nbsp;&nbsp;
                            <div class="bi-star-fill"></div>
                        </div>

                        <!-- Sale Price -->
                        <strike class="text-danger fw-bold">${{ product.price }}</strike>
                        &nbsp;
                        <span class="text-success fw-bold">${{ product.sale_price }}</span>

                    {% else %}
                        <!-- Normal Price -->
                        <span class="fw-bold fs-5">${{ product.price }}</span>
                    {% endif %}

                    <!-- Wishlist Button -->
                    <div class="mt-3">
                        <button type="button" value="{{ product.id }}" class="btn btn-secondary" id="add-wishlist">
                            Add to Wishlist
                        </button>
                    </div>

                    <!-- Home Button -->
                    <div class="mt-3">
                        <a href="{% url 'home' %}" class="btn btn-dark">Back to Home</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<!-- AJAX SCRIPT FOR WISHLIST -->
<script>
$(document).on('click', '#add-wishlist', function(e){
    e.preventDefault();
    $.ajax({
        type: 'POST',
        url: "{% url 'wishlist_add' %}",
        data: {
            product_id: $('#add-wishlist').val(),
            csrfmiddlewaretoken: '{{ csrf_token }}',
            action: 'post'
        },
        success: function(json){
            alert(json.message);
            document.getElementById("wishlist_quantity").textContent = json.qty;
        }
    });
});
</script>

{% endblock %}
